[package]
name = "robust_rust"
version = "1.5.0"
edition = "2021"
autobins = false

[[bin]]
name = "verux_apb"
path = "src/main.rs"

[dependencies]
glium = "0.35.0"
image = "0.25.10"
imgui = "0.12.0"
imgui-glium-renderer = "0.13.0"
imgui-winit-support = "0.13.0"
serialport = "4"
windows = { version = "0.52.0", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_Graphics_Dxgi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common"] }
base64 = "0.22.0"
sha2 = "0.10.8"
aes-gcm = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9.0", default-features = false, features = ["tls"] }
arboard = "3.4.0"

[build-dependencies]
winres = "0.1.12"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
