[package]
name = "verux-apb-inference"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
color-only = []

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
