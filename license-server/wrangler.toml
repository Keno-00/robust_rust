[[r2_buckets]]
binding = "ALGORITHM_ARTIFACTS"
bucket_name = "verux-algorithm-artifacts"

[[durable_objects.bindings]]
name = "LICENSE_COORDINATOR"
class_name = "LicenseCoordinator"

[[migrations]]
tag = "v1-license-coordinator"
new_sqlite_classes = ["LicenseCoordinator"]

[[d1_databases]]
binding = "LICENSE_DB"
database_name = "verux-license"
database_id = "218e697b-b904-48ff-96bf-f744a4c89f1e"
migrations_dir = "migrations"

[[ratelimits]]
name = "ACTIVATION_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 180, period = 60 }

[[ratelimits]]
name = "DISCORD_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# Independent edge-IP ceilings run before parsing or Payhip/database work.
# Existing per-license/session/actor limits remain separate.
[[ratelimits]]
name = "ACTIVATION_NETWORK_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "SESSION_NETWORK_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 1200, period = 60 }

[[ratelimits]]
name = "DISCORD_NETWORK_RATE_LIMITER"
namespace_id = "1006"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "ALGORITHM_RATE_LIMITER"
namespace_id = "1007"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "FIRMWARE_RATE_LIMITER"
namespace_id = "1008"
simple = { limit = 10, period = 60 }

# Launcher release storage is independent of encrypted licensed artifacts.
# Provision this bucket before deploying this binding; do not make it public.
[[r2_buckets]]
binding = "RELEASE_ARTIFACTS"
bucket_name = "verux-release-artifacts"

[[ratelimits]]
name = "RELEASE_RATE_LIMITER"
namespace_id = "1009"
simple = { limit = 600, period = 60 }
